name: Daily Mystery Shorts

on:
  # schedule:
  #   # 毎朝 9:00 JST (= 00:00 UTC)
  #   - cron: "0 0 * * *"
  workflow_dispatch:  # 手動実行のみ

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk ffmpeg imagemagick

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p output/audio output/images bgm/mysterious bgm/dark bgm/ethereal bgm/dramatic

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -c "
          from notify_slack import notify_slack_error
          notify_slack_error('GitHub Actions ワークフローが失敗しました', 'CI/CD')
          "
